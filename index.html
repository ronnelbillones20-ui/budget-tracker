<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Baloo+2:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<script src="js/theme.js"></script>
</head>
<body>

<button class="theme-toggle theme-toggle-fixed" id="themeToggle">☾ Dark</button>

<div class="auth-wrap">
  <div class="auth-brand">
    <h1>Ledger<span class="brand-mark">.</span></h1>
    <p>Track what comes in, what goes out, and get rewarded for the difference.</p>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="login" id="tabLogin">Log in</button>
    <button class="tab" data-tab="signup" id="tabSignup">Sign up</button>
  </div>

  <div class="auth-error" id="authError"></div>

  <!-- LOGIN FORM -->
  <form id="loginForm">
    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" required autocomplete="email" />
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" required autocomplete="current-password" />
    </div>
    <button type="submit" class="btn-primary" id="loginSubmit">Log in</button>
  </form>

  <!-- SIGNUP FORM -->
  <form id="signupForm" style="display:none;">
    <div class="field">
      <label for="signupName">Name</label>
      <input type="text" id="signupName" required autocomplete="name" />
    </div>
    <div class="field">
      <label for="signupEmail">Email</label>
      <input type="email" id="signupEmail" required autocomplete="email" />
    </div>
    <div class="field">
      <label for="signupPassword">Password</label>
      <input type="password" id="signupPassword" required minlength="6" autocomplete="new-password" />
    </div>
    <button type="submit" class="btn-primary" id="signupSubmit">Create account</button>
  </form>
</div>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
