<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<script src="js/theme.js"></script>
</head>
<body>

<div class="shell">

  <header class="site-header">
    <p class="brand">Ledger<span class="brand-mark">.</span></p>
    <div class="header-right">
      <button class="theme-toggle" id="themeToggle">☾ Dark</button>
      <span id="userEmail"></span>
      <button class="text-btn" id="logoutBtn">Log out</button>
    </div>
  </header>

  <!-- HERO: current balance + this month's budget progress -->
  <section class="hero">
    <p class="hero-label">Balance — this month</p>
    <p class="hero-amount" id="heroAmount">$0.00</p>

    <div class="hero-stats">
      <div class="hero-stat"><span class="dot income"></span>In: <strong id="statIncome">$0.00</strong></div>
      <div class="hero-stat"><span class="dot expense"></span>Out: <strong id="statExpense">$0.00</strong></div>
    </div>

    <p class="budget-line" id="budgetLine">No monthly budget set yet.</p>
    <div class="budget-track"><div class="budget-fill" id="budgetFill" style="width:0%"></div></div>
    <div class="budget-warning" id="budgetWarning" style="display:none;"></div>
  </section>

  <!-- MONTHLY CHALLENGE -->
  <section class="section" id="challengeSection" style="display:none;">
    <div class="section-head">
      <h2>This month's challenge</h2>
      <span class="hint" id="challengeDaysLeft"></span>
    </div>
    <div class="challenge-card" id="challengeCard"></div>
  </section>

  <!-- ADD ENTRY -->
  <section class="section">
    <div class="section-head">
      <h2>Add an entry</h2>
    </div>
    <form id="entryForm">
      <div class="entry-form">
        <div class="field-type">
          <select id="entryType">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>
        <div>
          <input type="text" id="entryCategory" placeholder="Category (e.g. Groceries)" required />
        </div>
        <div>
          <input type="number" id="entryAmount" placeholder="Amount" min="0.01" step="0.01" required />
        </div>
        <div class="field-note">
          <input type="text" id="entryNote" placeholder="Note (optional)" />
        </div>
        <div class="field-date">
          <input type="date" id="entryDate" required />
        </div>
      </div>
      <button type="submit" class="entry-submit">Add to register</button>
    </form>
  </section>

  <!-- REGISTER -->
  <section class="section">
    <div class="section-head">
      <h2>Register</h2>
      <span class="hint">This month</span>
    </div>
    <div class="register" id="register">
      <div class="empty-state">No entries yet — add your first one above.</div>
    </div>
  </section>

  <!-- CATEGORY BREAKDOWN -->
  <section class="section" id="categorySection" style="display:none;">
    <div class="section-head">
      <h2>Spending by category</h2>
      <span class="hint">This month</span>
    </div>
    <div class="category-list" id="categoryList"></div>
  </section>

  <!-- BUDGET -->
  <section class="section">
    <div class="section-head">
      <h2>Monthly budget</h2>
    </div>
    <form class="budget-form" id="budgetForm">
      <input type="number" id="budgetInput" placeholder="e.g. 500" min="0" step="0.01" />
      <button type="submit" class="budget-save">Save</button>
    </form>
  </section>

  <!-- AWARDS -->
  <section class="section">
    <div class="section-head">
      <h2>Awards</h2>
      <span class="hint">Earned by budgeting wisely</span>
    </div>
    <div class="badge-strip" id="badgeStrip"></div>
  </section>

</div>

<div class="toast-stack" id="toastStack"></div>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
